<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f3f3; text-align: center; padding: 20px; }
    .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
    .btn { display: inline-block; padding: 10px 20px; margin: 20px 0; background: #ff6b6b; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome {{ name }}! 🎉</h1>
    <p>Thanks for joining our gym.</p>
    <p>Your plan: <strong>{{ plan }}</strong></p>
    <a class="btn" href="http://yourgymwebsite.com/login">Go to Dashboard</a>
    <p>We can’t wait to see your fitness journey! 💪</p>
  </div>
</body>
</html>
